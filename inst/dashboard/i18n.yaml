"Themes available in this dashboard:": "Temas disponíveis neste painel:"
" — a curated, no-controls entry point: four story charts summarizing a century of Brazilian higher education (secular expansion, public vs. private networks with the 1997/2005 regulatory landmarks, the rise of distance education, and the gender reversal in schooling).": " — apresentação sem filtros: quatro gráficos sobre um século da educação superior brasileira (expansão secular, redes pública e privada com os marcos de 1997/2005, avanço da EAD e inversão da diferença de escolaridade por sexo)."
" — enrollment counts and gross rates by level, race and state (1871–2010, Kang/FGV-IBRE).": " — contagens e taxas brutas de matrícula por etapa, raça/cor e estado (1871–2010, Kang/FGV-IBRE)."
" — higher-education enrollment 1907–2024, multi-source compilation (IBGE 20th-Century Statistics, Maduro Junior, Kang et al., INEP Synopsis, INEP Microdata). Lets you compare estimates from different sources side by side.": " — matrículas no ensino superior, 1907–2024, compiladas de várias fontes (IBGE Século XX, Maduro Junior, Kang et al., INEP Sinopse, INEP Microdados). Permite comparar estimativas lado a lado."
" — mean years of schooling by sex, race and state (1925–2015, Walter & Kang).": " — anos médios de estudo por sexo, raça/cor e estado (1925–2015, Walter & Kang)."
" — public spending on education as share of GDP, per-student in % of GDP per capita, and the Kang & Menetrier (2024) double-ratio indicators of fiscal regressivity (Brazil, 1933–2010).": " — despesa pública em educação em % do PIB, por estudante em % do PIB per capita e razões duplas de regressividade fiscal de Kang & Menetrier (2024), Brasil, 1933–2010."
" — GDR6 grade-progression ratio (enrollment grades 4-6 / grades 1-3), at BR and 20 UFs (1955–2010, Kang/Paese/Felix).": " — razão de progressão GDR6 (matrículas nas séries 4–6 / séries 1–3), Brasil e 20 UFs (1955–2010, Kang/Paese/Felix)."
" — cumulative share of population aged 15–64 who completed at least primary / secondary / tertiary education, by country and sex (111 countries, 1870–2010 in 5-year steps, Lee & Lee 2016).": " — proporção cumulativa da população de 15–64 anos com pelo menos o primário / secundário / terciário completo, por país e sexo (111 países, 1870–2010 em intervalos de cinco anos, Lee & Lee 2016)."
