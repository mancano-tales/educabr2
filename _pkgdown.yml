url: https://mancano-tales.github.io/educabr2/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: '#2d6a4f'
    base_font:
      google: Source Sans Pro
    heading_font:
      google: Source Sans Pro
    code_font:
      google: JetBrains Mono
  opengraph:
    image:
      src: man/figures/logo.png
      alt: 'Logo do educabr2 / educabr2 logo'
    twitter:
      creator: '@mancano_tales'
      card: summary

home:
  title: 'educabr2: Educação brasileira / Brazilian education'
  description: >
    Séries históricas harmonizadas da educação brasileira em R: matrículas,
    escolaridade, despesa pública e progressão escolar, com proveniência e painel.
    Harmonized historical series on Brazilian education in R: enrollment,
    schooling, public expenditure and progression, with provenance and a dashboard.
  links:
  - text: Painel interativo / Interactive dashboard
    href: https://qx3hly-tales-man0ano.shinyapps.io/educabr2/
  - text: Código no GitHub / Source on GitHub
    href: https://github.com/mancano-tales/educabr2
  - text: Relatar problema / Report an issue
    href: https://github.com/mancano-tales/educabr2/issues

navbar:
  structure:
    left: [intro_pt, intro_en, reference, articles]
    right: [search, dashboard, github]
  components:
    intro_pt:
      text: Português
      href: articles/introducao-pt.html
    intro_en:
      text: English
      href: articles/introduction.html
    reference:
      text: Referência / Reference
      href: reference/index.html
    articles:
      text: Artigos / Articles
      menu:
      - text: Introdução (PT-BR)
        href: articles/introducao-pt.html
      - text: Introduction (EN)
        href: articles/introduction.html
      - text: Visualização (PT-BR)
        href: articles/visualizacao-pt.html
      - text: Visualization (EN)
        href: articles/visualization.html
    dashboard:
      icon: fa-chart-line
      href: https://qx3hly-tales-man0ano.shinyapps.io/educabr2/
      aria-label: Painel interativo / Interactive dashboard

reference:
- title: Acesso aos dados / Data access
  desc: >
    API das séries harmonizadas; cada função retorna um tibble no esquema
    comum de `inst/dict/schema.yaml`. / Harmonized-series API; each function
    returns a tibble following the common schema in `inst/dict/schema.yaml`.
  contents:
  - get_enrollment
  - get_schooling
  - get_expenditure
  - get_progression
  - get_attainment
- title: Citação e proveniência / Citation and provenance
  desc: >
    Descubra e cite as fontes originais, além do pacote. /
    Discover and cite the original sources as well as the package.
  contents:
  - list_sources
  - educabr_cite
- title: Visualização / Visualization
  desc: >
    Tema ggplot2, paleta Okabe-Ito segura para daltonismo e eixo de anos para
    séries históricas. / A ggplot2 theme, colourblind-safe Okabe-Ito palette
    and year axis for historical series.
  contents:
  - theme_educabr
  - scale_colour_educabr
  - scale_fill_educabr
  - scale_x_year_educabr
- title: Painel / Dashboard
  desc: >
    Abra o painel Shiny local ou consulte o [painel público](https://qx3hly-tales-man0ano.shinyapps.io/educabr2/).
    / Launch the local Shiny app or visit the [public dashboard](https://qx3hly-tales-man0ano.shinyapps.io/educabr2/).
  contents:
  - run_dashboard
- title: Conjuntos de dados / Backing datasets
  desc: >
    Objetos distribuídos com o pacote. Prefira as funções `get_*()` para
    filtrar, normalizar o esquema e traduzir rótulos. / Objects bundled with
    the package. Prefer `get_*()` to filter, normalize the schema and translate labels.
  contents:
  - enrollment_kang_fgv
  - enrollment_tertiary
  - schooling_kang_fgv
  - expenditure_kang_fgv
  - progression_kang_fgv
  - lee_lee_2016
- title: Pacote / Package
  contents: educabr2-package

articles:
- title: Tutoriais em português / Portuguese tutorials
  navbar: ~
  contents:
  - introducao-pt
  - visualizacao-pt
- title: Tutorials in English / Tutoriais em inglês
  navbar: ~
  contents:
  - introduction
  - visualization

development:
  mode: release

footer:
  structure:
    left: [developed_by, package]
    right: [built_with]
  components:
    package: >
      Código / Code: GPL (>= 3). Dados / Data: CC BY 4.0, salvo restrições
      da fonte original / unless restricted by the original source
      (inst/dict/vocabularies/sources.yaml).
